[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrle"
version = "0.1.0"
description = "Vector Run-Length Encoding: tokens as direction, frequency as magnitude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vrle authors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "zstandard>=0.22", "brotli>=1.1"]

[tool.setuptools]
packages = ["vrle"]
